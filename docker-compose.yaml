services:
  postgres:
    image: postgres:18-bookworm
    container_name: server-template-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PORT: ${POSTGRES_PORT}

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - postgres-data:/var/lib/postgresql

  redis:
    image: redis:8-alpine
    container_name: server-template-redis

    restart: unless-stopped

    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_PORT: ${REDIS_PORT}

    command: >
      sh -c '
      echo "user app on >$REDIS_PASSWORD ~* +@all" > /tmp/users.acl &&
      redis-server --aclfile /tmp/users.acl
      '

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "--user",
          "app",
          "--pass",
          "${REDIS_PASSWORD}",
          "ping"
        ]
      interval: 5s
      timeout: 5s
      retries: 5

    ports:
      - "${REDIS_PORT}:6379"

    volumes:
      - redis-data:/data

  migrate:
    image: migrate/migrate:v4.19.1

    profiles:
      - tools

    volumes:
      - ./migrations:/migrations

    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data: